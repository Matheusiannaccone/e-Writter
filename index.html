<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#34251d">
  <title>Início · e-Writter</title>
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/components.css">
  <style>
    .welcome { display: grid; align-content: center; min-height: min(55vh, 32rem); padding-block: 3rem; }
    .welcome__eyebrow { margin: 0 0 .75rem; color: var(--color-primary); font-size: .85rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .welcome h1 { max-width: 13ch; margin: 0; font: 600 clamp(3rem, 9vw, 6rem)/.98 var(--font-reading); letter-spacing: -.025em; }
    .welcome p:not(.welcome__eyebrow) { max-width: 38rem; margin: 1.5rem 0 2rem; color: var(--color-text-muted); font-size: 1.1rem; }
    .welcome__actions { display: flex; flex-wrap: wrap; gap: .75rem; }
    .home-books { padding-block: 0 var(--space-5); }
    .home-books h2 { margin: 0 0 var(--space-3); font: 600 clamp(2rem, 5vw, 3rem)/1 var(--font-reading); }
    .home-books__state { max-width: 38rem; padding: var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); color: var(--color-text-muted); }
  </style>
  <script type="module" src="./js/components/site-layout.js"></script>
  <script type="module" src="./js/pages/home-books.js"></script>
</head>
<body>
  <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
  <!-- Cabeçalho global com navegação responsiva e ações conforme a sessão. -->
  <header class="site-header" data-site-header></header>
  <main id="conteudo" class="welcome page-container">
    <p class="welcome__eyebrow">Histórias que aproximam</p>
    <h1>Todo capítulo começa aqui.</h1>
    <p>Um espaço para descobrir histórias e acompanhar cada página no seu ritmo.</p>
    <div class="welcome__actions"><a class="button" href="#home-books-title">Explorar livros</a></div>
  </main>
  <!-- Catálogo público: home-books.js controla carregamento, erro, vazio e criação dos cards. -->
  <section class="home-books page-container" aria-labelledby="home-books-title">
    <h2 id="home-books-title">Histórias para começar</h2>
    <p class="home-books__state" id="home-books-state" role="status">Carregando livros…</p>
    <button class="button button--secondary" id="home-books-retry" type="button" hidden>Tentar novamente</button>
    <div class="book-grid" id="home-books-grid" aria-label="Livros publicados"></div>
  </section>
  <footer class="site-footer" data-site-footer></footer>
</body>
</html>
